name: Build Eevee-spoti.pw (combined IPA)


# One workflow = one finished IPA: builds spoti.pw's SpotifyGlass AND
# EeveeSpotifyReincarnated from source, injects Eevee into the spoti.pw
# IPA with cyan, and uploads the combined result.
#
# You still supply: a direct link to YOUR decrypted Spotify IPA.
# You still do: signing on-device (Feather / Ksign / SideStore).


on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (9.1.78 recommended — spoti.pw's tested pin)"
        required: true
        type: string
      es_ref:
        description: "EeveeSpotify source: v6.6.8 = tested on Spotify 9.1.72/.74 (closest to 9.1.78); master = tested on 9.1.84"
        default: "v6.6.8"
        required: false
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]


env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"


jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git


      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive


      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable


      # ───────────────────── spoti.pw (SpotifyGlass) ─────────────────────


      - name: Checkout spoti.pw
        uses: actions/checkout@v4
        with:
          repository: skopevoj/spoti.pw
          path: spotipw
          submodules: recursive


      - name: Download base IPA (input is masked in logs)
        run: |
          mkdir -p spotipw/ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o spotipw/ipa/spotify.ipa
          case "$(file --mime-type -b spotipw/ipa/spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::Not an IPA"; exit 1 ;;
          esac


      - name: Build spoti.pw IPA
        working-directory: spotipw
        run: make release


      # ─────────────── EeveeSpotifyReincarnated (dylib) ───────────────


      - name: Checkout EeveeSpotifyReincarnated
        uses: actions/checkout@v4
        with:
          repository: SideloadLabs/EeveeSpotifyReincarnated
          ref: ${{ inputs.es_ref }}
          path: eevee
          submodules: recursive


      - name: Build EeveeSwiftProtobuf.framework from source
        working-directory: eevee
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh


      - name: Build EeveeSpotify .deb (rootless)
        working-directory: eevee
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "::error::deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_ENV"


      - name: Extract dylib + framework + bundle from deb
        run: |
          dpkg-deb -R "$DEB_PATH" debroot
          mkdir -p inject
          find debroot -name 'EeveeSpotify.dylib'          -exec cp {} inject/ \;
          find debroot -type d -name 'EeveeSwiftProtobuf.framework' -exec cp -R {} inject/ \;
          find debroot -type d -name 'EeveeSpotify.bundle' -exec cp -R {} inject/ \;
          ls -la inject/
          [ -f inject/EeveeSpotify.dylib ] || { echo "::error::dylib missing" >&2; exit 1; }


      # ─────────────────── Combine with cyan (pyzule) ───────────────────


      - name: Inject Eevee into the spoti.pw IPA
        run: |
          BASE_IPA=$(ls spotipw/out/*.ipa | head -1)
          # Same flags EeveeSpotifyReincarnated's own workflow uses:
          # -c 9 max compression, -m 15.0 MinOS floor, -du strips appex/Watch
          cyan -i "$BASE_IPA" -o "Eevee-spotipw.ipa" \
               -f inject/EeveeSpotify.dylib \
                  inject/EeveeSwiftProtobuf.framework \
                  inject/EeveeSpotify.bundle \
               -c 9 -m 15.0 -du
          ls -la Eevee-spotipw.ipa


      # ────────────────────────── Outputs ──────────────────────────


      - uses: actions/upload-artifact@v4
        if: inputs.upload_method != 'filebin'
        with:
          name: Eevee-spotipw-ipa
          path: Eevee-spotipw.ipa
          if-no-files-found: error


      - name: Upload to filebin.net (optional)
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="eevee-spotipw-${{ github.run_id }}"
          curl -fsS -X POST -H "Content-Type: application/octet-stream" \
            --data-binary "@Eevee-spotipw.ipa" \
            "https://filebin.net/$BIN/Eevee-spotipw.ipa" > /dev/null
          echo "### Download (bin auto-deletes after inactivity)" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://filebin.net/$BIN/Eevee-spotipw.ipa" >> "$GITHUB_STEP_SUMMARY"
